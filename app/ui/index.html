<!doctype html>
<html lang="zh-CN" data-theme="system" data-accent="hp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="HP Offline — 直连局域网打印机的本地控制台，不经过任何云服务。" />
    <title>HP Offline · 本地打印控制台</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <script>
      // 首屏主题：在样式生效前应用持久化设置，避免闪烁
      (function () {
        try {
          var theme = localStorage.getItem('hp.theme');
          if (theme === 'light' || theme === 'dark' || theme === 'system') {
            document.documentElement.dataset.theme = theme;
          }
          var accent = localStorage.getItem('hp.accent');
          if (accent) document.documentElement.dataset.accent = accent;
        } catch (e) {
          /* localStorage 不可用时使用默认值 */
        }
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#view">跳到主要内容</a>

    <div class="app" id="app">
      <aside class="rail" aria-label="主导航">
        <div class="rail-brand">
          <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
          <span class="brand-text">
            <span class="brand-name">HP Offline</span>
            <span class="brand-sub">局域网直连</span>
          </span>
        </div>

        <nav class="rail-nav">
          <a class="nav-item" href="#/home" data-route="home" data-icon="home">
            <span class="nav-icon"></span><span class="nav-label">首页</span>
          </a>
          <a class="nav-item" href="#/print" data-route="print" data-icon="print">
            <span class="nav-icon"></span><span class="nav-label">打印</span>
          </a>
          <a class="nav-item" href="#/scan" data-route="scan" data-icon="scan">
            <span class="nav-icon"></span><span class="nav-label">扫描</span>
          </a>
          <a class="nav-item" href="#/tasks" data-route="tasks" data-icon="list">
            <span class="nav-icon"></span><span class="nav-label">任务</span>
          </a>
          <a class="nav-item" href="#/printer" data-route="printer" data-icon="print">
            <span class="nav-icon"></span><span class="nav-label">打印机</span>
          </a>
          <a class="nav-item" href="#/history" data-route="history" data-icon="history">
            <span class="nav-icon"></span><span class="nav-label">历史</span>
          </a>
          <a class="nav-item" href="#/settings" data-route="settings" data-icon="settings">
            <span class="nav-icon"></span><span class="nav-label">设置</span>
          </a>
        </nav>

        <div class="rail-footer">
          <div class="cloud-seal" title="本应用不发起任何公网请求">
            <span class="cloud-seal-icon" aria-hidden="true"></span>
            <span class="cloud-seal-text">
              <span class="cloud-seal-title">零云端</span>
              <span class="cloud-seal-sub" id="cloud-calls">0 次公网请求</span>
            </span>
          </div>
          <span class="rail-version" id="rail-version">v—</span>
        </div>
      </aside>

      <div class="shell">
        <header class="topbar">
          <div class="topbar-heading">
            <h1 class="topbar-title" id="page-title">首页</h1>
            <p class="topbar-sub" id="page-sub">本地打印控制台</p>
          </div>
          <div class="topbar-actions">
            <span class="mock-chip-slot" id="mock-slot"></span>
            <button class="printer-chip" id="printer-chip" type="button" aria-label="当前打印机">
              <span class="printer-chip-dot" aria-hidden="true"></span>
              <span class="printer-chip-text" id="printer-chip-text">正在连接…</span>
            </button>
            <span class="topbar-divider" aria-hidden="true"></span>
            <button class="icon-btn" id="btn-refresh" type="button" aria-label="刷新打印机状态" title="刷新打印机状态"></button>
            <button class="icon-btn" id="btn-theme" type="button" aria-label="切换深浅色主题" title="切换深浅色主题"></button>
          </div>
        </header>

        <main class="main" id="main">
          <div class="offline-slot" id="offline-slot" hidden></div>
          <div class="view" id="view" role="region" aria-label="页面内容"></div>
        </main>
      </div>
    </div>

    <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>
    <div id="dialog-root"></div>

    <noscript>
      <div class="noscript">HP Offline 需要启用 JavaScript 才能运行。</div>
    </noscript>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
